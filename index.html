<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satta King Fast Result & Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f9; }
        header { background: #1e293b; color: #fff; padding: 20px; text-align: center; }
        nav { background: #334155; padding: 10px; text-align: center; }
        nav button { background: #3b82f6; color: white; border: none; padding: 10px 20px; margin: 0 5px; cursor: pointer; border-radius: 4px; font-size: 15px; }
        nav button:hover { background: #2563eb; }
        .container { max-width: 800px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .section { display: none; }
        .active { display: block; }
        .card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; margin-bottom: 20px; border-radius: 6px; text-align: center; }
        .card h3 { margin: 10px 0; color: #1e293b; font-size: 20px; }
        .card span { color: #ef4444; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #cbd5e1; padding: 12px; text-align: center; }
        th { background: #1e293b; color: white; }
        tr:nth-child(even) { background: #f8fafc; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #334155; }
        input[type="date"], input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 4px; }
        .btn-submit { background: #22c55e; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; font-size: 16px; border-radius: 4px; }
        .btn-submit:hover { background: #16a34a; }
        .btn-back { background: #64748b; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; margin-top: 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <h1>Satta King Fast Live Result</h1>
        <p>Fastest & Accurate Satta Results Portal</p>
    </header>

    <nav>
        <button onclick="switchTab('home')">Live Results & Charts</button>
        <button onclick="requestAdminLogin()">Admin Panel</button>
    </nav>

    <div class="container">
        <!-- HOME SECTION -->
        <div id="home-section" class="section active">
            <h2>Today's Live Updates</h2>
            <div class="card">
                <h3>Disawar: <span id="live-disawar">--</span></h3>
                <h3>Faridabad: <span id="live-faridabad">--</span></h3>
                <h3>Ghaziabad: <span id="live-ghaziabad">--</span></h3>
                <h3>Gali: <span id="live-gali">--</span></h3>
            </div>

            <h2>Recent Records History</h2>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Disawar</th>
                        <th>Faridabad</th>
                        <th>Ghaziabad</th>
                        <th>Gali</th>
                    </tr>
                </thead>
                <tbody id="records-table-body">
                    <!-- Dynamic Data Goes Here -->
                </tbody>
            </table>
        </div>

        <!-- ADMIN SECTION -->
        <div id="admin-section" class="section">
            <h2>Admin Control Panel</h2>
            <p>Publish or Update Daily Results</p>
            <form id="admin-form" onsubmit="saveData(event)">
                <div class="form-group">
                    <label>Select Date:</label>
                    <input type="date" id="input-date" required>
                </div>
                <div class="form-group">
                    <label>Disawar Result:</label>
                    <input type="text" id="input-disawar" placeholder="e.g. 45">
                </div>
                <div class="form-group">
                    <label>Faridabad Result:</label>
                    <input type="text" id="input-faridabad" placeholder="e.g. 12">
                </div>
                <div class="form-group">
                    <label>Ghaziabad Result:</label>
                    <input type="text" id="input-ghaziabad" placeholder="e.g. 89">
                </div>
                <div class="form-group">
                    <label>Gali Result:</label>
                    <input type="text" id="input-gali" placeholder="e.g. 33">
                </div>
                <button type="submit" class="btn-submit">Save Result</button>
            </form>
            <button class="btn-back" onclick="switchTab('home')">Back to Home</button>
        </div>
    </div>

    <script>
        // Tab Navigation
        function switchTab(tabName) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            if (tabName === 'home') {
                document.getElementById('home-section').classList.add('active');
                renderData();
            } else if (tabName === 'admin') {
                document.getElementById('admin-section').classList.add('active');
            }
        }

        // Simple Admin Authentication Prompt
        function requestAdminLogin() {
            let password = prompt("Enter Admin Password (default password is: admin123):");
            if (password === "admin123") {
                switchTab('admin');
            } else if (password !== null) {
                alert("Incorrect Password! Access Denied.");
            }
        }

        // Save Form Data to localStorage
        function saveData(event) {
            event.preventDefault();
            let date = document.getElementById('input-date').value;
            let disawar = document.getElementById('input-disawar').value || "XX";
            let faridabad = document.getElementById('input-faridabad').value || "XX";
            let ghaziabad = document.getElementById('input-ghaziabad').value || "XX";
            let gali = document.getElementById('input-gali').value || "XX";

            let records = JSON.parse(localStorage.getItem('satta_db')) || [];

            // Check if entry for this date already exists, update it if so
            let index = records.findIndex(r => r.date === date);
            if (index !== -1) {
                records[index] = { date, disawar, faridabad, ghaziabad, gali };
            } else {
                records.unshift({ date, disawar, faridabad, ghaziabad, gali }); // Add to top
            }

            localStorage.setItem('satta_db', JSON.stringify(records));
            alert("Result Saved Successfully!");
            document.getElementById('admin-form').reset();
            switchTab('home');
        }

        // Render Data on Homepage
        function renderData() {
            let records = JSON.parse(localStorage.getItem('satta_db')) || [];
            let tbody = document.getElementById('records-table-body');
            tbody.innerHTML = "";

            if (records.length > 0) {
                // Show latest record in top cards
                document.getElementById('live-disawar').innerText = records[0].disawar;
                document.getElementById('live-faridabad').innerText = records[0].faridabad;
                document.getElementById('live-ghaziabad').innerText = records[0].ghaziabad;
                document.getElementById('live-gali').innerText = records[0].gali;

                records.forEach(row => {
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.date}</td>
                        <td>${row.disawar}</td>
                        <td>${row.faridabad}</td>
                        <td>${row.ghaziabad}</td>
                        <td>${row.gali}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="5">No records found. Click on 'Admin Panel' to add results.</td></tr>`;
                document.getElementById('live-disawar').innerText = "--";
                document.getElementById('live-faridabad').innerText = "--";
                document.getElementById('live-ghaziabad').innerText = "--";
                document.getElementById('live-gali').innerText = "--";
            }
        }

        // Initial Load
        renderData();
    </script>
</body>
</html>
